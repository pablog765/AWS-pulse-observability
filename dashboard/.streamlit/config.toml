[theme]
base = "light"
primaryColor = "#EC7211"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
borderColor = "#D5DBE5"
font = "sans serif"

# Barra lateral oscura (azul AWS) para contrastar con el fondo claro
[theme.sidebar]
backgroundColor = "#232F3E"
secondaryBackgroundColor = "#2F3E52"
textColor = "#FFFFFF"
primaryColor = "#FF9900"
borderColor = "#3E4F66"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true
port = 8501
# 0.0.0.0 permite abrirlo desde otras máquinas de la red (exige AWS_PULSE_PASSWORD para accesos remotos)
address = "0.0.0.0"
enableXsrfProtection = true
